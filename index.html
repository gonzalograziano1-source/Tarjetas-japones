<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="青空">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>青空 — Japonés</title>
<style>
:root{
  --bg:#0b1020;--panel:#131a2a;--panel2:#192235;--input:#0d1423;
  --text:#f8fafc;--muted:#94a3b8;--accent:#69b3f3;--accent2:#559bd9;
  --border:#2a354b;--danger:#47171d;--dangerText:#fecaca;
}
*{box-sizing:border-box}
html{margin:0;min-height:100%;background:#0b1020;overscroll-behavior-y:none}
body{margin:0;min-height:100vh;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{width:min(720px,100%);margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 34px)}
.hidden{display:none!important}
.phrase-hero{padding:30px 0 28px;margin:0 0 18px;display:flex;justify-content:center;align-items:center;overflow:hidden}
.phrase-hero.hidden{display:none!important}
.home-phrase{margin:0;max-width:100%;white-space:nowrap;text-align:center;font-size:30px;font-weight:760;line-height:1.2;letter-spacing:.01em;color:var(--text)}
.home-phrase .kanji{color:var(--accent)}
.subtitle{margin-top:7px;color:var(--muted);font-size:15px}
.small{color:var(--muted);font-size:13px}
.section-title{font-size:18px;margin:0 0 12px}
.panel{background:rgba(19,26,42,.9);border:1px solid var(--border);border-radius:22px;padding:16px;margin-top:16px}
.primary,.secondary,.danger,.icon-btn{
  border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--panel2);color:var(--text);font-weight:750
}
.primary{background:var(--accent);border-color:var(--accent)}
.danger{background:var(--danger);color:var(--dangerText)}
.icon-btn{padding:10px 12px}
.full{width:100%}
.folder-list{display:grid;gap:10px}
.folder{
  position:relative;display:grid;grid-template-columns:1fr auto;align-items:start;gap:12px;
  background:rgba(19,26,42,.92);border:1px solid var(--border);border-radius:18px;padding:16px;
}
.folder-main{cursor:pointer;min-width:0}
.folder-name{font-size:18px;font-weight:780;margin-bottom:4px;padding-right:4px}
.folder-count{color:var(--muted);font-size:13px}
.menu-wrap{position:relative;align-self:center}
.overflow-btn{
  width:38px;height:38px;padding:0;border:0;background:transparent;color:#d5dae3;
  font-size:27px;line-height:30px;font-weight:800;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:0
}
.overflow-btn:active{background:rgba(255,255,255,.06)}
.context-menu{
  display:none;position:absolute;right:44px;top:50%;transform:translateY(-50%);z-index:30;min-width:148px;
  background:#1a2437;border:1px solid #394761;border-radius:14px;padding:4px;
  box-shadow:0 14px 38px rgba(0,0,0,.42)
}
.context-menu::after{
  content:"";position:absolute;right:-7px;top:50%;width:12px;height:12px;
  background:#1a2437;border-top:1px solid #394761;border-right:1px solid #394761;
  transform:translateY(-50%) rotate(45deg);border-radius:2px
}
.context-menu.open{display:block}
.context-action{
  width:100%;border:0;background:transparent;color:var(--text);text-align:left;
  padding:6px 9px;border-radius:9px;font-weight:700;font-size:13.5px;cursor:pointer;
  display:flex;align-items:center;gap:9px;position:relative;z-index:1
}
.context-action svg{width:16px;height:16px;flex:0 0 16px;stroke:currentColor}
.context-action:active{background:rgba(255,255,255,.06)}
.context-action.delete{color:#ff7278}
.form{display:grid;gap:10px}
input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--border);background:var(--input);color:var(--text);outline:none}
input:focus{border-color:#64748b}
.card-wrap{perspective:1200px;margin:12px 0 18px}
.card{height:330px;position:relative;transform-style:preserve-3d;transition:transform .42s ease;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;border:1px solid var(--border);backface-visibility:hidden;
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;
background:linear-gradient(145deg,#172033,#0f172a);box-shadow:0 18px 50px rgba(0,0,0,.30)}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#202a3d,#131a2a)}
.jp,.es{position:absolute;left:28px;right:28px;top:50%;transform:translateY(-50%);word-break:break-word}
.jp{font-size:52px;font-weight:800;line-height:1.18}
.es{font-size:36px;font-weight:800;line-height:1.22}
.back .romaji{position:absolute;left:28px;right:28px;top:calc(50% + 38px);font-size:18px;color:var(--muted)}
.actions{display:block}
.actions .primary{width:100%}
.backline{display:flex;align-items:center;margin-bottom:10px}
.backlink{background:none;border:0;color:var(--text);padding:8px 0;font-weight:700;font-size:15px}
.folder-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding-right:24px}
.folder-title-row h1{font-size:28px;margin:0}
.folder-title-row .small{font-size:15px;white-space:nowrap}
.completion{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center}
.completion-icon{width:74px;height:74px;color:var(--accent);margin-bottom:22px;animation:completePop .46s cubic-bezier(.2,.8,.25,1) both}
.completion-icon svg{width:100%;height:100%;display:block;overflow:visible}
.completion-title{font-size:27px;font-weight:800;line-height:1.2;animation:completeFade .42s ease .08s both}
.completion-ja{margin-top:12px;font-size:19px;color:var(--accent);font-weight:650;animation:completeFade .42s ease .15s both}
@keyframes completePop{0%{opacity:0;transform:scale(.82)}70%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes completeFade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.empty-card{color:var(--muted);font-size:16px;max-width:260px;line-height:1.45}
.list{display:grid;gap:8px;max-height:360px;overflow:auto}
.item{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;background:var(--input);border:1px solid var(--border);border-radius:13px;padding:11px 12px}
.item strong{display:block;font-size:17px}.item span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
@media(max-width:520px){
  .phrase-hero{padding:28px 0 26px;margin-bottom:16px}
  .home-phrase{font-size:28px}
  .card{height:310px}.jp{font-size:46px}.es{font-size:31px}
  .folder{padding:14px}
}
</style>
</head>
<body>
<main class="app">

<section id="homeView">
  <div id="phraseHero" class="phrase-hero hidden" aria-live="polite">
    <p id="homePhrase" class="home-phrase"></p>
  </div>

  <div id="allFolder" class="folder" style="margin-bottom:10px">
    <div class="folder-main">
      <div class="folder-name">Todas las tarjetas</div>
      <div id="allCount" class="folder-count">0 tarjetas</div>
    </div>
  </div>

  <div id="folderList" class="folder-list"></div>

  <section class="panel">
    <h2 class="section-title">Nueva carpeta</h2>
    <form id="folderForm" class="form">
      <input id="folderName" autocomplete="off" required>
      <button class="primary full" type="submit">Crear carpeta</button>
    </form>
  </section>
</section>

<section id="studyView" class="hidden">
  <div class="backline">
    <button id="backHome" class="backlink">← Carpetas</button>
  </div>
  <div class="folder-title-row">
    <h1 id="studyTitle">Carpeta</h1>
    <div id="counter" class="small"></div>
  </div>

  <section class="card-wrap">
    <div id="card" class="card">
      <div id="frontFace" class="face">
        <div id="jp" class="jp">—</div>
      </div>
      <div id="backFace" class="face back">
        <div id="es" class="es">—</div>
        <div id="romaji" class="romaji"></div>
      </div>
    </div>
  </section>

  <div class="actions">
    <button id="next" class="primary">Siguiente</button>
  </div>

  <section id="addCardPanel" class="panel">
    <h2 class="section-title">Agregar tarjeta</h2>
    <form id="cardForm" class="form">
      <input id="fjp" placeholder="Japonés" required>
      <input id="fromaji" placeholder="Romaji">
      <input id="fes" placeholder="Español" required>
      <button class="primary full" type="submit">Guardar tarjeta</button>
    </form>
  </section>

  <section class="panel">
    <h2 class="section-title">Tarjetas de este grupo</h2>
    <div id="cardList" class="list"></div>
  </section>
</section>

</main>

<script>
const STORAGE_KEY="aozora_flashcards_v2";

const KANJI_FOLDER_ID="kanji";
const DEFAULT_FOLDERS=[
  {id:KANJI_FOLDER_ID,name:"Kanji",system:true},
  {id:"saludos",name:"Saludos"},
  {id:"dias-semana",name:"Días de la semana"},
  {id:"lugares",name:"Lugares"},
  {id:"comida",name:"Comida"},
  {id:"verbos",name:"Verbos"}
];

let state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null") || {
  folders: DEFAULT_FOLDERS,
  cards: []
};

let currentFolderId="all";
let studyDeck=[];
let studyIndex=0;
let roundComplete=false;
let lastCompletedOrder=[];

const $=id=>document.getElementById(id);

// La carpeta Kanji es fija y se agrega también a instalaciones anteriores sin borrar datos.
function ensureKanjiFolder(){
  state.folders=Array.isArray(state.folders)?state.folders:[];
  let folder=state.folders.find(f=>f.id===KANJI_FOLDER_ID);
  if(!folder){
    state.folders.unshift({id:KANJI_FOLDER_ID,name:"Kanji",system:true});
  }else{
    folder.name="Kanji";
    folder.system=true;
  }
  state.cards=Array.isArray(state.cards)?state.cards:[];
}
ensureKanjiFolder();

// Desde esta versión cada tarjeta pertenece a una sola carpeta.
// Para instalaciones anteriores conservamos la primera carpeta válida de cada tarjeta.
function ensureSingleFolderPerCard(){
  const validIds=new Set(state.folders.map(f=>f.id));
  state.cards.forEach(c=>{
    const ids=(Array.isArray(c.folderIds)?c.folderIds:[]).filter(id=>validIds.has(id));
    if(ids.includes(KANJI_FOLDER_ID)) c.folderIds=[KANJI_FOLDER_ID];
    else c.folderIds=ids.length?[ids[0]]:[];
  });
}
ensureSingleFolderPerCard();
localStorage.setItem(STORAGE_KEY,JSON.stringify(state));

const KANJI_RE=/[\u3400-\u4DBF\u4E00-\u9FFF々]/g;
const KANJI_TEST_RE=/[\u3400-\u4DBF\u4E00-\u9FFF々]/;
const ALLOWED_KANA_RE=/^[\u3040-\u309F\u30A0-\u30FFー・\s。、！？!?]+$/;

// Banco offline de frases simples. "w" es una palabra que debe existir EXACTAMENTE
// en una tarjeta de vocabulario. "k" es la forma con kanji que puede mostrarse
// solo si todos esos kanji están dentro de la carpeta Kanji. "t" es gramática libre.
const W=(w,k=null)=>({w,k});
const T=t=>({t});
const PHRASE_BANK=[

  [W("えき","駅"),T("は"),W("どこ"),T("ですか。")],
  [W("これ"),T("は"),W("いくら"),T("ですか。")],
  [W("かいしゃ","会社"),T("は"),W("どちら"),T("ですか。")],
  [W("もういちど","もう一度"),W("おねがいします","お願いします"),T("。")],
  [W("ゆっくり"),W("はなしてください","話してください"),T("。")]

function normalizeWord(text){
  return String(text||"").trim().replace(/[。！？!?]+$/g,"").replace(/\s+/g,"");
}

function vocabularyCards(){
  return state.cards.filter(c=>!(c.folderIds||[]).includes(KANJI_FOLDER_ID));
}

function vocabularySet(){
  return new Set(vocabularyCards().map(c=>normalizeWord(c.jp)).filter(Boolean));
}

function allowedKanjiSet(){
  const set=new Set();
  cardsForFolder(KANJI_FOLDER_ID).forEach(c=>{
    const matches=String(c.jp||"").match(KANJI_RE)||[];
    matches.forEach(ch=>set.add(ch));
  });
  return set;
}

function canUseKanjiForm(form,allowed){
  const kanji=String(form||"").match(KANJI_RE)||[];
  return kanji.length>0 && kanji.every(ch=>allowed.has(ch));
}

function phraseIsAvailable(parts,vocab){
  return parts.every(part=>!part.w || vocab.has(normalizeWord(part.w)));
}

function renderPhraseParts(parts,allowed){
  return parts.map(part=>{
    if(part.t!==undefined) return part.t;
    return part.k && canUseKanjiForm(part.k,allowed) ? part.k : part.w;
  }).join("");
}

function highlightKanji(text){
  const frag=document.createDocumentFragment();
  for(const ch of text){
    if(KANJI_TEST_RE.test(ch)){
      const span=document.createElement("span");
      span.className="kanji";
      span.textContent=ch;
      frag.append(span);
    }else{
      frag.append(document.createTextNode(ch));
    }
  }
  return frag;
}

let homePhraseText="";
function chooseHomePhrase(){
  const vocab=vocabularySet();
  if(!vocab.size) return "";
  const allowed=allowedKanjiSet();
  const available=PHRASE_BANK.filter(parts=>phraseIsAvailable(parts,vocab));
  if(!available.length) return "";
  const parts=available[Math.floor(Math.random()*available.length)];
  return renderPhraseParts(parts,allowed);
}

function fitPhraseToOneLine(){
  const el=$("homePhrase");
  if(!el || !el.textContent) return;
  const max=30,min=20;
  let size=window.innerWidth<=520?28:max;
  el.style.fontSize=size+"px";
  while(el.scrollWidth>el.clientWidth && size>min){
    size-=1;
    el.style.fontSize=size+"px";
  }
}

function renderHomePhrase(forceNew=false){
  const hero=$("phraseHero");
  const phrase=$("homePhrase");
  if(forceNew || !homePhraseText) homePhraseText=chooseHomePhrase();
  if(!homePhraseText){
    hero.classList.add("hidden");
    phrase.replaceChildren();
    return;
  }
  hero.classList.remove("hidden");
  phrase.replaceChildren(highlightKanji(homePhraseText));
  requestAnimationFrame(fitPhraseToOneLine);
}

window.addEventListener("resize",()=>requestAnimationFrame(fitPhraseToOneLine));

function closeAllMenus(except=null){
  document.querySelectorAll(".context-menu.open").forEach(menu=>{
    if(menu!==except) menu.classList.remove("open");
  });
}

function makeOverflowMenu(onEdit,onDelete){
  const wrap=document.createElement("div");
  wrap.className="menu-wrap";

  const btn=document.createElement("button");
  btn.type="button";
  btn.className="overflow-btn";
  btn.setAttribute("aria-label","Opciones");
  btn.textContent="⋮";

  const menu=document.createElement("div");
  menu.className="context-menu";

  const edit=document.createElement("button");
  edit.type="button";
  edit.className="context-action";
  edit.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Editar`;
  edit.onclick=e=>{
    e.stopPropagation();
    menu.classList.remove("open");
    onEdit();
  };

  const del=document.createElement("button");
  del.type="button";
  del.className="context-action delete";
  del.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5M14 11v5"/></svg>Eliminar`;
  del.onclick=e=>{
    e.stopPropagation();
    menu.classList.remove("open");
    onDelete();
  };

  btn.onclick=e=>{
    e.stopPropagation();
    const opening=!menu.classList.contains("open");
    closeAllMenus();
    if(opening) menu.classList.add("open");
  };

  menu.onclick=e=>e.stopPropagation();
  menu.append(edit,del);
  wrap.append(btn,menu);
  return wrap;
}

document.addEventListener("click",()=>closeAllMenus());

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  homePhraseText="";
  renderHome();
}

function slugId(){
  return "f_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}
function cardId(){
  return "c_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}
function countText(n){return n+" "+(n===1?"tarjeta":"tarjetas")}
function getFolder(id){return state.folders.find(f=>f.id===id)}
function cardsForFolder(id){
  if(id==="all") return state.cards;
  return state.cards.filter(c=>(c.folderIds||[]).includes(id));
}

function renderHome(){
  $("folderList").innerHTML="";
  $("allCount").textContent=countText(state.cards.length);
  renderHomePhrase();

  state.folders.forEach(folder=>{
    const row=document.createElement("div");
    row.className="folder";

    const main=document.createElement("div");
    main.className="folder-main";
    main.innerHTML=`<div class="folder-name"></div><div class="folder-count"></div>`;
    main.querySelector(".folder-name").textContent=folder.name;
    main.querySelector(".folder-count").textContent=countText(cardsForFolder(folder.id).length);
    main.onclick=()=>openStudy(folder.id);

    if(folder.id===KANJI_FOLDER_ID){
      row.append(main);
    }else{
      const menu=makeOverflowMenu(
        ()=>{
          const name=prompt("Nombre de la carpeta:",folder.name);
          if(name===null)return;
          const n=name.trim();
          if(!n)return;
          folder.name=n; save();
        },
        ()=>{
          const n=cardsForFolder(folder.id).length;
          const msg=n
            ? `¿Eliminar "${folder.name}" y sus ${n} ${n===1?"tarjeta":"tarjetas"}?`
            : `¿Eliminar "${folder.name}"?`;
          if(!confirm(msg))return;
          state.cards=state.cards.filter(c=>!(c.folderIds||[]).includes(folder.id));
          state.folders=state.folders.filter(f=>f.id!==folder.id);
          save();
        }
      );
      row.append(main,menu);
    }
    $("folderList").append(row);
  });
}

$("allFolder").onclick=()=>openStudy("all");

$("folderForm").onsubmit=e=>{
  e.preventDefault();
  const name=$("folderName").value.trim();
  if(!name)return;
  state.folders.push({id:slugId(),name});
  save();
  e.target.reset();
};

function shuffleCards(cards){
  const arr=[...cards];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function sameOrder(a,b){
  return a.length===b.length && a.every((c,i)=>c.id===b[i]?.id);
}

function startNewRound({avoidLast=false}={}){
  const cards=cardsForFolder(currentFolderId);
  let nextDeck=shuffleCards(cards);
  if(avoidLast && cards.length>1 && sameOrder(nextDeck,lastCompletedOrder)){
    for(let tries=0;tries<8 && sameOrder(nextDeck,lastCompletedOrder);tries++) nextDeck=shuffleCards(cards);
    if(sameOrder(nextDeck,lastCompletedOrder)) nextDeck=[...nextDeck.slice(1),nextDeck[0]];
  }
  studyDeck=nextDeck;
  studyIndex=0;
  roundComplete=false;
  renderStudyList();
  showCurrentCard();
}

function openStudy(folderId){
  currentFolderId=folderId;
  lastCompletedOrder=[];
  $("homeView").classList.add("hidden");
  $("studyView").classList.remove("hidden");

  const folder=getFolder(folderId);
  $("studyTitle").textContent=folderId==="all"?"Todas las tarjetas":folder.name;
  $("addCardPanel").classList.toggle("hidden",folderId==="all");

  startNewRound();
  window.scrollTo(0,0);
}

$("backHome").onclick=()=>{
  studyDeck=[];
  studyIndex=0;
  roundComplete=false;
  lastCompletedOrder=[];
  $("studyView").classList.add("hidden");
  $("homeView").classList.remove("hidden");
  renderHome();
  window.scrollTo(0,0);
};

  // 3. Destellos / estrellas

  `<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M24 68V12"/><path d="M26 15c13-6 23 5 36-1v25c-13 6-23-5-36 1V15Z" fill="currentColor" stroke="none"/></svg>`,

  `<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 65l18-23 10 10 18-25 16 38"/><path d="M55 27V10"/><path d="M56 11h16l-5 6 5 6H56" fill="currentColor" stroke="none"/></svg>`,

];

const COMPLETION_PHRASES=[
  "よくできました！",
  "おつかれさま！",
  "すごい！",
  "おめでとう！",
  "がんばりました！",
  "やったね！",
  "すばらしい！"
];

function randomFrom(arr){return arr[Math.floor(Math.random()*arr.length)]}

function clearCompletion(){
  const existing=$("frontFace").querySelector(".completion");
  if(existing) existing.remove();
  $("jp").classList.remove("hidden");
  $("backFace").classList.remove("hidden");
}

function showCurrentCard(){
  clearCompletion();
  $("card").classList.remove("flipped");

  if(!studyDeck.length){
    $("jp").textContent="—";
    $("es").textContent="Todavía no hay tarjetas";
    $("romaji").textContent="";
    $("counter").textContent="0 / 0";
    return;
  }

  const c=studyDeck[studyIndex];
  $("jp").textContent=c.jp;
  $("es").textContent=c.es;
  $("romaji").textContent=c.romaji||"";
  $("counter").textContent=(studyIndex+1)+" / "+studyDeck.length;
}

function showCompletion(){
  if(!studyDeck.length)return;
  roundComplete=true;
  lastCompletedOrder=[...studyDeck];
  $("card").classList.remove("flipped");
  $("jp").classList.add("hidden");
  $("backFace").classList.add("hidden");
  $("counter").textContent=studyDeck.length+" / "+studyDeck.length;

  const completion=document.createElement("div");
  completion.className="completion";
  completion.innerHTML=`
    <div class="completion-icon">${randomFrom(COMPLETION_ICONS)}</div>
    <div class="completion-title">¡Carpeta completada!</div>
    <div class="completion-ja">${randomFrom(COMPLETION_PHRASES)}</div>`;
  $("frontFace").append(completion);
}

$("card").onclick=()=>{
  if(studyDeck.length && !roundComplete) $("card").classList.toggle("flipped");
};

$("next").onclick=()=>{
  if(!studyDeck.length)return;
  if(roundComplete){
    startNewRound({avoidLast:true});
    return;
  }
  if(studyIndex>=studyDeck.length-1){
    showCompletion();
    return;
  }
  studyIndex+=1;
  showCurrentCard();
};

$("cardForm").onsubmit=e=>{
  e.preventDefault();
  const jp=$("fjp").value.trim();
  const romaji=$("fromaji").value.trim();
  const es=$("fes").value.trim();
  if(!jp||!es)return;

  if(currentFolderId===KANJI_FOLDER_ID){
    if(!KANJI_TEST_RE.test(jp)){
      alert("En la carpeta Kanji, el campo Japonés debe incluir al menos un kanji.");
      return;
    }
  }else{
    if(KANJI_TEST_RE.test(jp)){
      alert("Las palabras de vocabulario deben escribirse en hiragana y/o katakana. Los kanji se agregan por separado en la carpeta Kanji.");
      return;
    }
    if(!ALLOWED_KANA_RE.test(jp)){
      alert("Usá hiragana y/o katakana en el campo Japonés.");
      return;
    }
  }

  if(currentFolderId==="all") return;
  const folderIds=[currentFolderId];

  state.cards.push({id:cardId(),jp,romaji,es,folderIds});
  save();
  e.target.reset();
  startNewRound();
};

function renderStudyList(){
  // El listado inferior refleja exactamente el mazo aleatorio de la ronda actual.
  const cards=[...studyDeck];
  $("cardList").innerHTML="";

  if(!cards.length){
    $("cardList").innerHTML='<div class="empty-card">Esta carpeta está vacía. Las palabras que agregues van a aparecer acá.</div>';
    return;
  }

  cards.forEach(c=>{
    const row=document.createElement("div"); row.className="item";
    const text=document.createElement("div");
    const strong=document.createElement("strong"); strong.textContent=c.jp;
    const span=document.createElement("span"); span.textContent=c.romaji||"";
    text.append(strong);
    if(c.romaji) text.append(span);


    const menu=makeOverflowMenu(
      ()=>editCard(c),
      ()=>{
        if(!confirm("¿Eliminar esta tarjeta?"))return;
        state.cards=state.cards.filter(x=>x.id!==c.id);
        save(); startNewRound();
      }
    );

    row.append(text,menu); $("cardList").append(row);
  });
}

function editCard(c){
  const jp=prompt("Japonés:",c.jp); if(jp===null)return;
  const romaji=prompt("Romaji:",c.romaji||""); if(romaji===null)return;
  const es=prompt("Español:",c.es); if(es===null)return;

  const nextJp=jp.trim()||c.jp;
  const isKanjiCard=(c.folderIds||[]).includes(KANJI_FOLDER_ID);
  if(isKanjiCard){
    if(!KANJI_TEST_RE.test(nextJp)){
      alert("Esta tarjeta pertenece a Kanji y debe incluir al menos un kanji.");
      return;
    }
  }else{
    if(KANJI_TEST_RE.test(nextJp) || !ALLOWED_KANA_RE.test(nextJp)){
      alert("Las palabras de vocabulario deben escribirse en hiragana y/o katakana.");
      return;
    }
  }

  c.jp=nextJp;
  c.romaji=romaji.trim();
  c.es=es.trim()||c.es;
  c.folderIds=[isKanjiCard?KANJI_FOLDER_ID:(c.folderIds||[])[0]].filter(Boolean);

  save();
  startNewRound();
}

renderHome();
