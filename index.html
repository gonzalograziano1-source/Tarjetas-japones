<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Japonés" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>Tarjetas de Japonés</title>
  <style>
    :root{
      --bg:#0b1020; --panel:#131a2a; --panel2:#1b2436; --text:#f8fafc;
      --muted:#94a3b8; --accent:#ef4444; --accent2:#dc2626; --border:#2a354b;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    body{min-height:100vh}
    .app{width:min(720px,100%);margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 32px)}
    .top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:12px}
    h1{font-size:26px;margin:0;letter-spacing:-.03em}
    .small{color:var(--muted);font-size:13px}
    .card-wrap{perspective:1200px;margin:18px 0}
    .card{height:330px;position:relative;transform-style:preserve-3d;transition:transform .4s ease;cursor:pointer;-webkit-tap-highlight-color:transparent}
    .card.flipped{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;border-radius:24px;border:1px solid var(--border);backface-visibility:hidden;
      display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;
      background:linear-gradient(145deg,#172033,#0f172a);box-shadow:0 18px 50px rgba(0,0,0,.32)}
    .back{transform:rotateY(180deg);background:linear-gradient(145deg,#202a3d,#131a2a)}
    .label{position:absolute;top:20px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted)}
    .jp{font-size:52px;font-weight:800;line-height:1.2;word-break:break-word}
    .romaji{margin-top:10px;color:var(--muted);font-size:18px}
    .es{font-size:36px;font-weight:800;line-height:1.2}
    .hint{position:absolute;bottom:18px;color:var(--muted);font-size:12px}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    button{font:inherit;border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--panel2);color:var(--text);font-weight:700}
    button.primary{background:var(--accent);border-color:var(--accent)}
    button.primary:active{background:var(--accent2)}
    .panel{background:rgba(19,26,42,.88);border:1px solid var(--border);border-radius:20px;padding:16px;margin-top:14px}
    .panel h2{font-size:18px;margin:0 0 12px}
    .form{display:grid;gap:10px}
    input{width:100%;font:inherit;padding:14px;border-radius:12px;border:1px solid var(--border);background:#0c1322;color:var(--text);outline:none}
    input:focus{border-color:#64748b}
    .list{display:grid;gap:8px;max-height:320px;overflow:auto}
    .item{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;background:#0d1423;border:1px solid var(--border);border-radius:12px;padding:10px}
    .item strong{display:block;font-size:17px}.item span{display:block;color:var(--muted);font-size:13px;margin-top:2px}
    .item-actions{display:flex;gap:6px}
    .mini{padding:8px 10px;font-size:12px;border-radius:10px}
    .danger{background:#2a1115;color:#fecaca}
    .empty{color:var(--muted);text-align:center;padding:24px}
    @media(max-width:520px){.card{height:310px}.jp{font-size:46px}.es{font-size:31px}}
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>Tarjetas de Japonés</h1>
        <div class="small">Tocá la tarjeta para ver el significado</div>
      </div>
      <div id="counter" class="small"></div>
    </div>

    <section class="card-wrap">
      <div id="card" class="card">
        <div class="face">
          <div class="label">Japonés</div>
          <div id="jp" class="jp">こんにちは</div>
          <div id="romaji" class="romaji">konnichiwa</div>
          <div class="hint">Tocar para dar vuelta</div>
        </div>
        <div class="face back">
          <div class="label">Español</div>
          <div id="es" class="es">Hola</div>
          <div class="hint">Tocar para volver</div>
        </div>
      </div>
    </section>

    <div class="actions">
      <button id="random">Aleatoria</button>
      <button id="next" class="primary">Siguiente</button>
    </div>

    <section class="panel">
      <h2>Agregar tarjeta</h2>
      <form id="form" class="form">
        <input id="fjp" placeholder="Japonés — ej. まいばん" required />
        <input id="fromaji" placeholder="Romaji — opcional" />
        <input id="fes" placeholder="Español — ej. todas las noches" required />
        <button class="primary" type="submit">Guardar tarjeta</button>
      </form>
    </section>

    <section class="panel">
      <h2>Mis tarjetas</h2>
      <div id="list" class="list"></div>
    </section>
  </main>

<script>
const KEY="jp_flashcards_pwa_v1";
const defaults=[
  {jp:"こんにちは",romaji:"konnichiwa",es:"Hola"},
  {jp:"ありがとう",romaji:"arigatou",es:"Gracias"},
  {jp:"まいばん",romaji:"maiban",es:"Todas las noches"},
  {jp:"おととい",romaji:"ototoi",es:"Anteayer"},
  {jp:"にちようび",romaji:"nichiyoubi",es:"Domingo"}
];
let cards=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
let current=0;
const $=id=>document.getElementById(id);
const card=$("card"), jp=$("jp"), romaji=$("romaji"), es=$("es"), list=$("list"), counter=$("counter");

function save(){ localStorage.setItem(KEY,JSON.stringify(cards)); renderList(); }
function show(i){
  if(!cards.length){jp.textContent="—";romaji.textContent="";es.textContent="Agregá una tarjeta";counter.textContent="0";return;}
  current=((i%cards.length)+cards.length)%cards.length;
  const c=cards[current];
  jp.textContent=c.jp; romaji.textContent=c.romaji||""; es.textContent=c.es;
  counter.textContent=(current+1)+" / "+cards.length;
  card.classList.remove("flipped");
}
function random(){
  if(cards.length<2) return show(0);
  let i; do{i=Math.floor(Math.random()*cards.length)}while(i===current);
  show(i);
}
function renderList(){
  list.innerHTML="";
  if(!cards.length){list.innerHTML='<div class="empty">Todavía no hay tarjetas.</div>';counter.textContent="0";return;}
  cards.forEach((c,i)=>{
    const row=document.createElement("div");row.className="item";
    const text=document.createElement("div");
    const strong=document.createElement("strong");strong.textContent=c.jp;
    const span=document.createElement("span");span.textContent=(c.romaji?c.romaji+" · ":"")+c.es;
    text.append(strong,span);
    const acts=document.createElement("div");acts.className="item-actions";
    const edit=document.createElement("button");edit.className="mini";edit.textContent="Editar";
    edit.onclick=()=>{ const a=prompt("Japonés:",c.jp); if(a===null)return;
      const r=prompt("Romaji:",c.romaji||""); if(r===null)return;
      const b=prompt("Español:",c.es); if(b===null)return;
      cards[i]={jp:a.trim()||c.jp,romaji:r.trim(),es:b.trim()||c.es}; save(); show(i); };
    const del=document.createElement("button");del.className="mini danger";del.textContent="Eliminar";
    del.onclick=()=>{ if(confirm("¿Eliminar esta tarjeta?")){cards.splice(i,1); if(current>=cards.length)current=0; save(); show(current);} };
    acts.append(edit,del); row.append(text,acts); list.append(row);
  });
}
card.onclick=()=>card.classList.toggle("flipped");
$("next").onclick=()=>show(current+1);
$("random").onclick=random;
$("form").onsubmit=e=>{
  e.preventDefault();
  const a=$("fjp").value.trim(), r=$("fromaji").value.trim(), b=$("fes").value.trim();
  if(!a||!b)return;
  cards.push({jp:a,romaji:r,es:b}); save(); show(cards.length-1);
  e.target.reset(); $("fjp").focus();
};
renderList(); random();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js"));
}
</script>
</body>
</html>
