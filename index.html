<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="青空">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>青空 — Japonés</title>
<style>
:root{
  --bg:#0b1020;--panel:#131a2a;--panel2:#192235;--input:#0d1423;
  --text:#f8fafc;--muted:#94a3b8;--accent:#69b3f3;--accent2:#559bd9;
  --border:#2a354b;--danger:#47171d;--dangerText:#fecaca;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0b1020,#111827);color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input{font:inherit}
button{-webkit-tap-highlight-color:transparent}
.app{width:min(720px,100%);margin:0 auto;padding:calc(env(safe-area-inset-top) + 24px) 20px calc(env(safe-area-inset-bottom) + 34px)}
.hidden{display:none!important}
.hero{margin:0 0 18px;display:flex;justify-content:center;align-items:center}
.hero img{display:block;width:100%;max-width:680px;height:auto;object-fit:contain;background:transparent}
.subtitle{margin-top:7px;color:var(--muted);font-size:15px}
.small{color:var(--muted);font-size:13px}
.section-title{font-size:18px;margin:0 0 12px}
.panel{background:rgba(19,26,42,.9);border:1px solid var(--border);border-radius:22px;padding:16px;margin-top:16px}
.primary,.secondary,.danger,.icon-btn{
  border:1px solid var(--border);border-radius:14px;padding:14px 16px;background:var(--panel2);color:var(--text);font-weight:750
}
.primary{background:var(--accent);border-color:var(--accent)}
.danger{background:var(--danger);color:var(--dangerText)}
.icon-btn{padding:10px 12px}
.full{width:100%}
.folder-list{display:grid;gap:10px}
.folder{
  position:relative;display:grid;grid-template-columns:1fr auto;align-items:start;gap:12px;
  background:rgba(19,26,42,.92);border:1px solid var(--border);border-radius:18px;padding:16px;
}
.folder-main{cursor:pointer;min-width:0}
.folder-name{font-size:18px;font-weight:780;margin-bottom:4px;padding-right:4px}
.folder-count{color:var(--muted);font-size:13px}
.menu-wrap{position:relative;align-self:center}
.overflow-btn{
  width:38px;height:38px;padding:0;border:0;background:transparent;color:#d5dae3;
  font-size:27px;line-height:30px;font-weight:800;border-radius:12px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;margin-top:0
}
.overflow-btn:active{background:rgba(255,255,255,.06)}
.context-menu{
  display:none;position:absolute;right:0;top:39px;z-index:30;min-width:148px;
  background:#1a2437;border:1px solid #394761;border-radius:14px;padding:6px;
  box-shadow:0 14px 38px rgba(0,0,0,.42)
}
.context-menu.open{display:block}
.context-action{
  width:100%;border:0;background:transparent;color:var(--text);text-align:left;
  padding:11px 12px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer
}
.context-action:active{background:rgba(255,255,255,.06)}
.context-action.delete{color:#ff7278}
.form{display:grid;gap:10px}
input{width:100%;padding:14px 15px;border-radius:13px;border:1px solid var(--border);background:var(--input);color:var(--text);outline:none}
input:focus{border-color:#64748b}
.card-wrap{perspective:1200px;margin:16px 0 18px}
.card{height:330px;position:relative;transform-style:preserve-3d;transition:transform .42s ease;cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;border:1px solid var(--border);backface-visibility:hidden;
display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;
background:linear-gradient(145deg,#172033,#0f172a);box-shadow:0 18px 50px rgba(0,0,0,.30)}
.back{transform:rotateY(180deg);background:linear-gradient(145deg,#202a3d,#131a2a)}
.label{position:absolute;top:22px;color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.jp{font-size:52px;font-weight:800;line-height:1.18;word-break:break-word}
.romaji{font-size:18px;color:var(--muted);margin-top:12px}
.es{font-size:36px;font-weight:800;line-height:1.22}
.hint{position:absolute;bottom:20px;color:var(--muted);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.backline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.backlink{background:none;border:0;color:var(--text);padding:8px 0;font-weight:700;font-size:15px}
.folder-head h1{font-size:28px;margin:0}
.empty-card{color:var(--muted);font-size:16px;max-width:260px;line-height:1.45}
.list{display:grid;gap:8px;max-height:360px;overflow:auto}
.item{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;background:var(--input);border:1px solid var(--border);border-radius:13px;padding:11px 12px}
.item strong{display:block;font-size:17px}.item span{display:block;color:var(--muted);font-size:13px;margin-top:3px}
.badge{display:inline-block;margin-top:6px;padding:4px 7px;border-radius:999px;background:#1c2740;color:#b7c6e2;font-size:11px}
.checkbox-box{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.check{display:flex;align-items:center;gap:8px;background:var(--input);border:1px solid var(--border);border-radius:12px;padding:10px;font-size:13px}
.check input{width:auto;padding:0}
.note{color:var(--muted);font-size:12px;line-height:1.4}
hr{border:0;border-top:1px solid var(--border);margin:16px 0}
@media(max-width:520px){
  .card{height:310px}.jp{font-size:46px}.es{font-size:31px}
  .folder{padding:14px}.checkbox-box{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main class="app">

<section id="homeView">
  <div class="hero">
    <img id="heroImage" src="hero-1.png" alt="Mascota 青空 animando a estudiar japonés">
  </div>

  <div id="allFolder" class="folder" style="margin-bottom:10px">
    <div class="folder-main">
      <div class="folder-name">Todas las tarjetas</div>
      <div id="allCount" class="folder-count">0 tarjetas</div>
    </div>
  </div>

  <div id="folderList" class="folder-list"></div>

  <section class="panel">
    <h2 class="section-title">Nueva carpeta</h2>
    <form id="folderForm" class="form">
      <input id="folderName" placeholder="Ej. Saludos" autocomplete="off" required>
      <button class="primary full" type="submit">Crear carpeta</button>
    </form>
  </section>
</section>

<section id="studyView" class="hidden">
  <div class="backline">
    <button id="backHome" class="backlink">← Carpetas</button>
    <div id="counter" class="small"></div>
  </div>
  <div class="folder-head">
    <h1 id="studyTitle">Carpeta</h1>
    <div id="studySubtitle" class="subtitle"></div>
  </div>

  <section class="card-wrap">
    <div id="card" class="card">
      <div class="face">
        <div class="label">Japonés</div>
        <div id="jp" class="jp">—</div>
        <div id="romaji" class="romaji"></div>
        <div id="frontHint" class="hint">Tocar para dar vuelta</div>
      </div>
      <div class="face back">
        <div class="label">Español</div>
        <div id="es" class="es">—</div>
        <div class="hint">Tocar para volver</div>
      </div>
    </div>
  </section>

  <div class="actions">
    <button id="random" class="secondary">Aleatoria</button>
    <button id="next" class="primary">Siguiente</button>
  </div>

  <section class="panel">
    <h2 class="section-title">Agregar tarjeta</h2>
    <form id="cardForm" class="form">
      <input id="fjp" placeholder="Japonés" required>
      <input id="fromaji" placeholder="Romaji — opcional">
      <input id="fes" placeholder="Español" required>
      <div id="folderChecksWrap">
        <div class="note">Carpetas de esta tarjeta</div>
        <div id="folderChecks" class="checkbox-box"></div>
      </div>
      <button class="primary full" type="submit">Guardar tarjeta</button>
    </form>
  </section>

  <section class="panel">
    <h2 class="section-title">Tarjetas de este grupo</h2>
    <div id="cardList" class="list"></div>
  </section>
</section>

</main>

<script>
const STORAGE_KEY="aozora_flashcards_v2";

const DEFAULT_FOLDERS=[
  {id:"saludos",name:"Saludos"},
  {id:"dias-semana",name:"Días de la semana"},
  {id:"lugares",name:"Lugares"},
  {id:"comida",name:"Comida"},
  {id:"verbos",name:"Verbos"}
];

let state=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null") || {
  folders: DEFAULT_FOLDERS,
  cards: []
};

let currentFolderId="all";
let currentIndex=0;

const $=id=>document.getElementById(id);

const HERO_IMAGES=["hero-1.png","hero-2.png","hero-3.png","hero-4.png","hero-5.png","hero-6.png"];
const heroImage=$("heroImage");
if(heroImage){
  heroImage.src=HERO_IMAGES[Math.floor(Math.random()*HERO_IMAGES.length)];
}

function closeAllMenus(except=null){
  document.querySelectorAll(".context-menu.open").forEach(menu=>{
    if(menu!==except) menu.classList.remove("open");
  });
}

function makeOverflowMenu(onEdit,onDelete){
  const wrap=document.createElement("div");
  wrap.className="menu-wrap";

  const btn=document.createElement("button");
  btn.type="button";
  btn.className="overflow-btn";
  btn.setAttribute("aria-label","Opciones");
  btn.textContent="⋮";

  const menu=document.createElement("div");
  menu.className="context-menu";

  const edit=document.createElement("button");
  edit.type="button";
  edit.className="context-action";
  edit.textContent="Editar";
  edit.onclick=e=>{
    e.stopPropagation();
    menu.classList.remove("open");
    onEdit();
  };

  const del=document.createElement("button");
  del.type="button";
  del.className="context-action delete";
  del.textContent="Eliminar";
  del.onclick=e=>{
    e.stopPropagation();
    menu.classList.remove("open");
    onDelete();
  };

  btn.onclick=e=>{
    e.stopPropagation();
    const opening=!menu.classList.contains("open");
    closeAllMenus();
    if(opening) menu.classList.add("open");
  };

  menu.onclick=e=>e.stopPropagation();
  menu.append(edit,del);
  wrap.append(btn,menu);
  return wrap;
}

document.addEventListener("click",()=>closeAllMenus());

function save(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  renderHome();
}

function slugId(){
  return "f_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}
function cardId(){
  return "c_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7);
}
function countText(n){return n+" "+(n===1?"tarjeta":"tarjetas")}
function getFolder(id){return state.folders.find(f=>f.id===id)}
function cardsForFolder(id){
  if(id==="all") return state.cards;
  return state.cards.filter(c=>(c.folderIds||[]).includes(id));
}

function renderHome(){
  $("folderList").innerHTML="";
  $("allCount").textContent=countText(state.cards.length);

  state.folders.forEach(folder=>{
    const row=document.createElement("div");
    row.className="folder";

    const main=document.createElement("div");
    main.className="folder-main";
    main.innerHTML=`<div class="folder-name"></div><div class="folder-count"></div>`;
    main.querySelector(".folder-name").textContent=folder.name;
    main.querySelector(".folder-count").textContent=countText(cardsForFolder(folder.id).length);
    main.onclick=()=>openStudy(folder.id);

    const menu=makeOverflowMenu(
      ()=>{
        const name=prompt("Nombre de la carpeta:",folder.name);
        if(name===null)return;
        const n=name.trim();
        if(!n)return;
        folder.name=n; save();
      },
      ()=>{
        const n=cardsForFolder(folder.id).length;
        const msg=n
          ? `¿Eliminar "${folder.name}"? Las ${n} tarjetas no se borrarán; solamente dejarán de pertenecer a esta carpeta.`
          : `¿Eliminar "${folder.name}"?`;
        if(!confirm(msg))return;
        state.cards.forEach(c=>c.folderIds=(c.folderIds||[]).filter(id=>id!==folder.id));
        state.folders=state.folders.filter(f=>f.id!==folder.id);
        save();
      }
    );

    row.append(main,menu); $("folderList").append(row);
  });
}

$("allFolder").onclick=()=>openStudy("all");

$("folderForm").onsubmit=e=>{
  e.preventDefault();
  const name=$("folderName").value.trim();
  if(!name)return;
  state.folders.push({id:slugId(),name});
  save();
  e.target.reset();
};

function openStudy(folderId){
  currentFolderId=folderId;
  currentIndex=0;
  $("homeView").classList.add("hidden");
  $("studyView").classList.remove("hidden");

  const folder=getFolder(folderId);
  $("studyTitle").textContent=folderId==="all"?"Todas las tarjetas":folder.name;
  $("studySubtitle").textContent=folderId==="all"
    ?"Estudiá todo tu vocabulario junto"
    :"Estudiá este grupo de palabras";

  renderFolderChecks();
  renderStudyList();
  showCard(0);
  window.scrollTo(0,0);
}

$("backHome").onclick=()=>{
  $("studyView").classList.add("hidden");
  $("homeView").classList.remove("hidden");
  renderHome();
  window.scrollTo(0,0);
};

function renderFolderChecks(selectedIds){
  const wrap=$("folderChecks");
  wrap.innerHTML="";
  const initial=selectedIds || (currentFolderId==="all"?[]:[currentFolderId]);

  if(!state.folders.length){
    $("folderChecksWrap").classList.add("hidden");
    return;
  }
  $("folderChecksWrap").classList.remove("hidden");

  state.folders.forEach(folder=>{
    const label=document.createElement("label");
    label.className="check";
    const cb=document.createElement("input");
    cb.type="checkbox"; cb.value=folder.id; cb.checked=initial.includes(folder.id);
    const text=document.createElement("span"); text.textContent=folder.name;
    label.append(cb,text); wrap.append(label);
  });
}
function checkedFolderIds(){
  return [...$("folderChecks").querySelectorAll('input[type="checkbox"]:checked')].map(x=>x.value);
}

function showCard(i){
  const cards=cardsForFolder(currentFolderId);
  $("card").classList.remove("flipped");

  if(!cards.length){
    $("jp").textContent="—";
    $("romaji").textContent="";
    $("es").textContent="Todavía no hay tarjetas";
    $("frontHint").textContent="Agregá la primera abajo";
    $("counter").textContent="0 / 0";
    return;
  }

  currentIndex=((i%cards.length)+cards.length)%cards.length;
  const c=cards[currentIndex];
  $("jp").textContent=c.jp;
  $("romaji").textContent=c.romaji||"";
  $("es").textContent=c.es;
  $("frontHint").textContent="Tocar para dar vuelta";
  $("counter").textContent=(currentIndex+1)+" / "+cards.length;
}

$("card").onclick=()=>{
  if(cardsForFolder(currentFolderId).length) $("card").classList.toggle("flipped");
};
$("next").onclick=()=>showCard(currentIndex+1);
$("random").onclick=()=>{
  const cards=cardsForFolder(currentFolderId);
  if(cards.length<2)return showCard(0);
  let i; do{i=Math.floor(Math.random()*cards.length)}while(i===currentIndex);
  showCard(i);
};

$("cardForm").onsubmit=e=>{
  e.preventDefault();
  const jp=$("fjp").value.trim();
  const romaji=$("fromaji").value.trim();
  const es=$("fes").value.trim();
  if(!jp||!es)return;

  let folderIds=checkedFolderIds();
  if(currentFolderId!=="all" && !folderIds.includes(currentFolderId)) folderIds.push(currentFolderId);

  state.cards.push({id:cardId(),jp,romaji,es,folderIds});
  save();
  e.target.reset();
  renderFolderChecks();
  renderStudyList();
  const cards=cardsForFolder(currentFolderId);
  showCard(cards.length-1);
};

function renderStudyList(){
  const cards=cardsForFolder(currentFolderId);
  $("cardList").innerHTML="";

  if(!cards.length){
    $("cardList").innerHTML='<div class="empty-card">Esta carpeta está vacía. Las palabras que agregues van a aparecer acá.</div>';
    return;
  }

  cards.forEach(c=>{
    const row=document.createElement("div"); row.className="item";
    const text=document.createElement("div");
    const strong=document.createElement("strong"); strong.textContent=c.jp;
    const span=document.createElement("span"); span.textContent=(c.romaji?c.romaji+" · ":"")+c.es;
    text.append(strong,span);

    if(currentFolderId==="all" && (c.folderIds||[]).length){
      const badge=document.createElement("div"); badge.className="badge";
      badge.textContent=(c.folderIds||[]).map(id=>getFolder(id)?.name).filter(Boolean).join(" · ");
      text.append(badge);
    }

    const menu=makeOverflowMenu(
      ()=>editCard(c),
      ()=>{
        if(!confirm("¿Eliminar esta tarjeta?"))return;
        state.cards=state.cards.filter(x=>x.id!==c.id);
        save(); renderStudyList(); showCard(0);
      }
    );

    row.append(text,menu); $("cardList").append(row);
  });
}

function editCard(c){
  const jp=prompt("Japonés:",c.jp); if(jp===null)return;
  const romaji=prompt("Romaji:",c.romaji||""); if(romaji===null)return;
  const es=prompt("Español:",c.es); if(es===null)return;

  c.jp=jp.trim()||c.jp;
  c.romaji=romaji.trim();
  c.es=es.trim()||c.es;

  if(state.folders.length){
    const names=state.folders.map((f,i)=>`${i+1}. ${f.name}`).join("\n");
    const current=(c.folderIds||[]).map(id=>state.folders.findIndex(f=>f.id===id)+1).filter(n=>n>0).join(",");
    const answer=prompt(
      "Carpetas de la tarjeta.\nEscribí los números separados por coma.\n\n"+names,
      current
    );
    if(answer!==null){
      const nums=answer.split(",").map(x=>parseInt(x.trim())).filter(n=>n>=1&&n<=state.folders.length);
      c.folderIds=[...new Set(nums.map(n=>state.folders[n-1].id))];
    }
  }

  save(); renderStudyList(); showCard(currentIndex);
}

renderHome();
</script>
</body>
</html>
